name: taller1
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: monitor
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U monitor -d monitor"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    image: actividad1-iot-ia-migrate:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    command: [alembic, -c, backend/alembic.ini, upgrade, head]
    depends_on:
      db:
        condition: service_healthy
  api:
    image: actividad1-iot-ia-api:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports: ["${API_PORT:-8000}:8000"]
    volumes:
      - csv_data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
volumes:
  postgres_data:
  csv_data:
