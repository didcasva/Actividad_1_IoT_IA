name: taller1
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: monitor
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U monitor -d monitor"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  broker:
    profiles: [mqtt]
    image: eclipse-mosquitto:2.0
    ports: ["${MQTT_PORT:-1883}:1883"]
    environment:
      MQTT_WORKER_USERNAME: ${MQTT_WORKER_USERNAME:-rutasalud-worker}
      MQTT_WORKER_PASSWORD: ${MQTT_WORKER_PASSWORD:-}
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./.secrets/mosquitto:/mosquitto/secrets:ro
      - mqtt_data:/mosquitto/data
    healthcheck:
      test: [CMD-SHELL, 'mosquitto_sub -h 127.0.0.1 -u "$$MQTT_WORKER_USERNAME" -P "$$MQTT_WORKER_PASSWORD" -t "rutasalud/+/telemetria" -q 1 -E -W 5 -i rutasalud-health']
      interval: 15s
      timeout: 8s
      retries: 5
    restart: unless-stopped
  mqtt-worker:
    profiles: [mqtt]
    image: actividad1-iot-ia-mqtt:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      MQTT_HOST: broker
      MQTT_PORT: 1883
    command: [python, -m, app.mqtt_worker]
    volumes:
      - csv_data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -m, app.mqtt_worker, --healthcheck]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  migrate:
    image: actividad1-iot-ia-migrate:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    command: [alembic, -c, backend/alembic.ini, upgrade, head]
    depends_on:
      db:
        condition: service_healthy
  api:
    image: actividad1-iot-ia-api:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports: ["${API_PORT:-8000}:8000"]
    volumes:
      - csv_data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
volumes:
  postgres_data:
  csv_data:
  mqtt_data:
