apiVersion: 1
datasources:
  - name: InfluxDB RutaSalud
    uid: rutasalud-influx
    type: influxdb
    access: proxy
    url: ${INFLUX_URL}
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: rutasalud
      defaultBucket: telemetria
    secureJsonData:
      token: ${GRAFANA_INFLUX_TOKEN}
