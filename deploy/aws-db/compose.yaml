name: rutasalud-db
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure la clave administrativa}
      MONITOR_PASSWORD: ${MONITOR_PASSWORD:?Configure la clave de la aplicacion}
    ports:
      - "${DB_BIND_IP:?Configure la IP privada}:${DB_PUBLISH_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-app.sql:/docker-entrypoint-initdb.d/10-app.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U monitor -d monitor"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  influxdb:
    image: influxdb:2.7-alpine
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD:?Configure la clave de InfluxDB}
      DOCKER_INFLUXDB_INIT_ORG: rutasalud
      DOCKER_INFLUXDB_INIT_BUCKET: telemetria
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_ADMIN_TOKEN:?Configure el token administrativo de InfluxDB}
    ports:
      - "${DB_BIND_IP:?Configure la IP privada}:${INFLUX_PUBLISH_PORT:-8086}:8086"
    volumes:
      - influx_data:/var/lib/influxdb2
      - influx_config:/etc/influxdb2
    healthcheck:
      test: [CMD, influx, ping]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
  influx_data:
  influx_config:
