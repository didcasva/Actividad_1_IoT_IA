# 1883 solo existe dentro de Docker; el host publica unicamente 8883 TLS.
allow_anonymous false
password_file /mosquitto/secrets/passwords
acl_file /mosquitto/secrets/acl
listener 1883
listener 8883
certfile /tls/current/fullchain.pem
keyfile /tls/current/privkey.pem
tls_version tlsv1.2
persistence true
persistence_location /mosquitto/data/
autosave_interval 1
autosave_on_changes true
max_queued_messages 1000
message_size_limit 2048
max_packet_size 4096
log_dest stdout
log_type error
log_type warning
log_type notice
